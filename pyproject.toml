[tool.poetry]
name = "nexustalent-enterprise"
version = "1.0.0"
description = "Enterprise Modular HRMS + Talent CRM + Workforce Intelligence Platform"
authors = ["NexusTalent Architecture Team <engineering@nexustalent.io>"]
license = "Proprietary"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = "^2.0.28"
aiosqlite = "^0.20.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
scikit-learn = "^1.4.1.post1"
numpy = "^1.26.4"
pandas = "^2.2.1"
httpx = "^0.27.0"
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
pytest-cov = "^5.0.0"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=backend/app --cov-report=term-missing --cov-report=xml:coverage.xml"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["backend/app"]
omit = ["*/tests/*", "*/seeds/*"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
